# Content Sampler Configuration

sampling:
  default_strategy: random
  default_sample_size: 1000
  allow_duplicates: false
  random_seed: 42

schema_analysis:
  detect_types: true
  calculate_cardinality: true
  sample_values_limit: 10
  detect_patterns: true

optimization:
  target_database: sqlite
  infer_constraints: true
  suggest_indexes: true
  max_varchar_length: 255

noise_detection:
  enabled: true
  rules:
    missing_value: true
    outlier: true
    future_date: true
    negative_number: true
    invalid_email: true
    duplicate: true
  severity_thresholds:
    outlier_zscore: 3
    missing_rate_warning: 0.1
    duplicate_rate_warning: 0.05

output:
  format: json
  pretty_print: true
  include_metadata: true
